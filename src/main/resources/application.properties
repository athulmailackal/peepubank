spring.application.name=peepubank

# Dynamic Port Binding for Railway
server.port=${PORT:8080}

# Database Connection via Railway Environment Variables
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings (adjust strategy to your preference)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
